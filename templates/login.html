{% extends 'base.html' %}
{% block content %}
<div class="auth-container box-ia">
    <h2 class="titulo-pagina">Acesse o MonitorIA</h2>

    <form method="POST" action="{{ url_for('auth.login') }}" class="form-pergunta">
        <div class="form-grupo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-grupo">
            <label for="senha">Senha</label>
            <div class="campo-senha">
                <input type="password" id="senha" name="senha" class="form-control" required>
                <button type="button" class="btn-olho" onclick="alternarSenhaLogin(this)" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-roxo">Entrar</button>
    </form>
    <p class="auth-link">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>.</p>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

{% endblock %}
