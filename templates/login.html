{% extends 'base.html' %}
{% block content %}
<div class="auth-container box-ia">
    <h2 class="titulo-pagina">Acesse o MonitorIA</h2>

    <form method="POST" action="{{ url_for('auth.login') }}" class="form-pergunta">
        <div class="form-grupo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-grupo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-roxo">Entrar</button>
    </form>
    <p class="auth-link">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>.</p>
</div>
{% endblock %}
