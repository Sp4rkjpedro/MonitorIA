{% extends 'base.html' %}

{% block content %}
<div class="auth-container box-ia">
    <h2 class="titulo-pagina">Crie sua conta</h2>

    <form method="POST" action="{{ url_for('auth.cadastro') }}" class="form-pergunta">
        
        <div class="form-grupo">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
        </div>

        <div class="form-grupo">
            <label for="email">E-mail Acadêmico</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-grupo">
            <label for="senha">Senha</label>
            <div class="campo-senha">
                <input type="password" id="senha" name="senha" class="form-control" required>
                <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-grupo">
            <label for="confirmar_senha">Confirmar Senha</label>
            <div class="campo-senha">
                <input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control" required>
                <button type="button" class="btn-olho" onclick="alternarSenha('confirmar_senha', this)" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
            <small id="msg-senha" style="display:none; margin-top: 5px; font-weight: 600;"></small>
        </div>

        <div class="form-grupo">
            <label for="papel">Eu sou um(a):</label>
            <select id="papel" name="papel" class="form-control" required>
                <option value="aluno">Aluno (Buscando Ajuda)</option>
                <option value="monitor">Monitor (Ajudando Alunos)</option>
            </select>
        </div>

        <button type="submit" class="btn btn-roxo">Cadastrar</button>
    </form>

    <p class="auth-link">
        Já tem uma conta?
        <a href="{{ url_for('auth.login') }}">Faça login aqui</a>.
    </p>
</div>

<script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
{% endblock %}
